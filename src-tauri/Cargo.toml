[package]
name = "markseal"
version = "0.1.0"
description = "High-performance, zero-knowledge native Markdown editor"
authors = ["D3lta Security"]
edition = "2021"

[lib]
name = "markseal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 3: Hardened Cryptography, Sanitization, Memory Safety & Native UI
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
ammonia = "4"
pulldown-cmark = "0.12"
window-vibrancy = "0.5"

# Hard-link count of a file, so a zero-overwrite never reaches data behind another name.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Argon2id and AES-GCM are unusably slow when unoptimised (seconds per unlock in `tauri dev`
# and minutes for the test suite), so the crypto crates are always built optimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3
