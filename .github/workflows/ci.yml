name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies (exact lockfile)
        run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Audit shipped JavaScript dependencies
        # Fails on moderate or worse in code that ships in the app. Build-only tools are
        # reported in the next step without failing the run.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all JavaScript dependencies (report only)
        continue-on-error: true
        run: npm audit

      - name: Set up Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run the Rust security tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
