name: Release

# Builds the Windows installer from the tagged public source on GitHub's runner and
# creates a DRAFT pre-release. Nothing is published until a maintainer reviews the
# draft and presses "Publish release".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write       # create the draft release
      id-token: write       # sign the build provenance attestation
      attestations: write   # store the attestation
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match the app version
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag app=$app"
          test "$tag" = "$app"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install JavaScript dependencies (exact lockfile)
        run: npm ci

      - name: Run the Rust security tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the installer
        run: npm run tauri build

      - name: Collect installer and checksums
        id: files
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cd out
          sha256sum *-setup.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*-setup.exe

      - name: Create draft pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*-setup.exe out/SHA256SUMS \
            --draft --prerelease \
            --title "Markseal $GITHUB_REF_NAME (unsigned preview)" \
            --notes-file .github/release-notes.md
